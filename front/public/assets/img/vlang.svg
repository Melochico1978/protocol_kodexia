<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05030d" />
      <stop offset="50%" stop-color="#0c071f" />
      <stop offset="100%" stop-color="#140c30" />
    </linearGradient>
    
    <!-- Neon Purple/Magenta to Cyan Gradient for Vlang -->
    <linearGradient id="neonV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd00ff" />
      <stop offset="50%" stop-color="#7b00ff" />
      <stop offset="100%" stop-color="#00e1ff" />
    </linearGradient>

    <!-- Glowing Cyan Accent -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>
    
    <!-- Strong Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Glow Filter -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Border & Background -->
  <rect width="300" height="200" fill="url(#bgGrad)" rx="6" />
  
  <!-- Cyberpunk Tech Grid -->
  <path d="M 0,20 L 300,20 M 0,40 L 300,40 M 0,60 L 300,60 M 0,80 L 300,80 M 0,100 L 300,100 M 0,120 L 300,120 M 0,140 L 300,140 M 0,160 L 300,160 M 0,180 L 300,180" stroke="#1c1240" stroke-width="0.75" />
  <path d="M 30,0 L 30,200 M 60,0 L 60,200 M 90,0 L 90,200 M 120,0 L 120,200 M 150,0 L 150,200 M 180,0 L 180,200 M 210,0 L 210,200 M 240,0 L 240,200 M 270,0 L 270,200" stroke="#1c1240" stroke-width="0.75" />
  
  <!-- Circuit Paths in Background -->
  <path d="M 40,150 L 90,150 L 110,130" stroke="#bd00ff" stroke-width="1" fill="none" opacity="0.3" stroke-dasharray="3,3" />
  <path d="M 260,50 L 210,50 L 190,70" stroke="#00e1ff" stroke-width="1" fill="none" opacity="0.3" stroke-dasharray="3,3" />

  <!-- Vlang Double-V Neon Logo -->
  <g filter="url(#glow)" transform="translate(150, 95)">
    <!-- Outer thick V shape (slanted/cyber) -->
    <path d="M -40,-35 L 0,35 L 40,-35" fill="none" stroke="url(#neonV)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Inner cyan detailed V shape -->
    <path d="M -20,-35 L 0,5 L 20,-35" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <path d="M -40,-35 L 0,35 L 40,-35" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  </g>
  
  <!-- Cyberpunk Text/Data -->
  <text x="150" y="168" font-family="'Courier New', monospace" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#subtleGlow)">[ LINGUAGEM V ]</text>
  <text x="150" y="181" font-family="'Courier New', monospace" font-size="8" fill="#bd00ff" text-anchor="middle" letter-spacing="1" opacity="0.8">RÁPIDA, ESTRUTURADA E SEGURA</text>
</svg>
