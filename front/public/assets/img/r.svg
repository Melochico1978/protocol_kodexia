<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b14" />
      <stop offset="50%" stop-color="#071629" />
      <stop offset="100%" stop-color="#0a1d36" />
    </linearGradient>
    
    <!-- Neon Blue/Cyan Gradient for R Logo -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#00aaff" />
      <stop offset="100%" stop-color="#0044ff" />
    </linearGradient>

    <!-- Neon White/Silver Gradient -->
    <linearGradient id="neonWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a3d8ff" />
    </linearGradient>
    
    <!-- Strong Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Glow Filter -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Border & Background -->
  <rect width="300" height="200" fill="url(#bgGrad)" rx="6" />
  
  <!-- Cyberpunk Tech Grid -->
  <path d="M 0,20 L 300,20 M 0,40 L 300,40 M 0,60 L 300,60 M 0,80 L 300,80 M 0,100 L 300,100 M 0,120 L 300,120 M 0,140 L 300,140 M 0,160 L 300,160 M 0,180 L 300,180" stroke="#0a2547" stroke-width="0.75" />
  <path d="M 30,0 L 30,200 M 60,0 L 60,200 M 90,0 L 90,200 M 120,0 L 120,200 M 150,0 L 150,200 M 180,0 L 180,200 M 210,0 L 210,200 M 240,0 L 240,200 M 270,0 L 270,200" stroke="#0a2547" stroke-width="0.75" />
  
  <!-- Cybernetic Corner Details -->
  <path d="M 12,25 L 25,12 M 288,25 L 275,12 M 12,175 L 25,188 M 288,175 L 275,188" stroke="#00f3ff" stroke-width="1" opacity="0.4" />
  
  <!-- HUD Circular Tech Accent -->
  <circle cx="150" cy="100" r="80" fill="none" stroke="#0044ff" stroke-width="1" stroke-dasharray="5,15,2,2" opacity="0.3" />
  <circle cx="150" cy="100" r="75" fill="none" stroke="#00f3ff" stroke-width="0.5" stroke-dasharray="100,60,40,20" opacity="0.2" />

  <!-- The R Logo - Cyberpunk Interpretation -->
  <g filter="url(#glow)">
    <!-- Slanted Tech Oval (Official R Oval Shape stylized) -->
    <ellipse cx="140" cy="95" rx="60" ry="46" transform="rotate(-15, 140, 95)" fill="none" stroke="url(#neonCyan)" stroke-width="4.5" stroke-dasharray="300" />
    <ellipse cx="140" cy="95" rx="60" ry="46" transform="rotate(-15, 140, 95)" fill="none" stroke="#00f3ff" stroke-width="1.5" opacity="0.8" />
    
    <!-- Stylized Neon Letter R (Constructed from Cyber Paths) -->
    <!-- R Core Structure: Vertical bar, top curve, slanted leg -->
    <path d="M 120,122 L 120,68 M 120,68 L 150,68 C 168,68 175,78 175,88 C 175,98 165,103 148,103 L 120,103 M 144,103 L 172,130" 
          fill="none" stroke="url(#neonWhite)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 120,122 L 120,68 M 120,68 L 150,68 C 168,68 175,78 175,88 C 175,98 165,103 148,103 L 120,103 M 144,103 L 172,130" 
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>
  
  <!-- Cyberpunk Text/Data -->
  <text x="150" y="172" font-family="'Courier New', monospace" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#subtleGlow)">[ LINGUAGEM R ]</text>
  <text x="150" y="185" font-family="'Courier New', monospace" font-size="8" fill="#00f3ff" text-anchor="middle" letter-spacing="1" opacity="0.8">ANÁLISE ESTATÍSTICA E GRÁFICOS</text>
</svg>
