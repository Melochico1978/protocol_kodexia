<div class="splash-container">
  <div class="bg-overlay"></div>
  <div class="crt-scanline"></div>

  <div class="boot-sequence">
    <div class="logo-container">
      <h1 class="glitch-title" data-text="KODEXIA OS">KODEXIA OS</h1>
      <p class="subtitle">PROTOCOL INITIALIZATION</p>
    </div>
    
    <div class="terminal-box">
      <div class="terminal-header">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="term-title">sys_boot.exe</span>
      </div>
      <div class="terminal-body">
        <p class="log-line">> <span class="highlight">{{ loadingMessage() }}</span><span class="cursor">_</span></p>
      </div>
    </div>
  </div>
</div>
